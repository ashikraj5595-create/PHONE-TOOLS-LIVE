<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Dominant Front Card Brand Gradient -->
    <linearGradient id="ptHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Front Card Edge Highlight -->
    <linearGradient id="ptHeroBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Tool Glyph Gradient -->
    <linearGradient id="ptGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>
  </defs>

  <!-- LAYER 1: PDF Tools (Far Left, Rose Accent) -->
  <g transform="rotate(-18, 50, 82)">
    <rect x="31" y="20" width="38" height="56" rx="7" fill="#0F172A" stroke="#E11D48" stroke-width="1.5" stroke-opacity="0.75" />
    <rect x="34" y="22" width="10" height="2" rx="1" fill="#F43F5E" />
    <path d="M 35 27 L 41 27 L 43 29 L 43 33 L 35 33 Z" fill="none" stroke="#FDA4AF" stroke-width="1" />
  </g>

  <!-- LAYER 2: Image Tools (Mid Left, Emerald Accent) -->
  <g transform="rotate(-9, 50, 82)">
    <rect x="31" y="20" width="38" height="56" rx="7" fill="#0F172A" stroke="#059669" stroke-width="1.5" stroke-opacity="0.75" />
    <rect x="34" y="22" width="10" height="2" rx="1" fill="#10B981" />
    <rect x="35" y="27" width="8" height="6" rx="1.5" fill="none" stroke="#6EE7B7" stroke-width="1" />
    <circle cx="37.5" cy="29.5" r="0.8" fill="#6EE7B7" />
  </g>

  <!-- LAYER 3: Calculator / Converter Tools (Far Right, Amber Accent) -->
  <g transform="rotate(18, 50, 82)">
    <rect x="31" y="20" width="38" height="56" rx="7" fill="#0F172A" stroke="#D97706" stroke-width="1.5" stroke-opacity="0.75" />
    <rect x="56" y="22" width="10" height="2" rx="1" fill="#F59E0B" />
    <circle cx="59" cy="28" r="1" fill="#FCD34D" />
    <line x1="62" y1="27" x2="58" y2="33" stroke="#FCD34D" stroke-width="1" stroke-linecap="round" />
    <circle cx="61" cy="32" r="1" fill="#FCD34D" />
  </g>

  <!-- LAYER 4: QR & Code Tools (Mid Right, Cyan Accent) -->
  <g transform="rotate(9, 50, 82)">
    <rect x="31" y="20" width="38" height="56" rx="7" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.75" />
    <rect x="56" y="22" width="10" height="2" rx="1" fill="#06B6D4" />
    <rect x="57" y="27" width="7" height="7" rx="1.5" fill="none" stroke="#67E8F9" stroke-width="1" />
    <rect x="59.25" y="29.25" width="2.5" height="2.5" fill="#67E8F9" />
  </g>

  <!-- LAYER 5 (FRONT HERO CARD): PHONE TOOLS Unified Brand Anchor -->
  <g>
    <!-- Outer Phone/Toolbox Card Chassis -->
    <rect
      x="27"
      y="24"
      width="46"
      height="62"
      rx="9"
      fill="url(#ptHeroGrad)"
      stroke="url(#ptHeroBorder)"
      stroke-width="1.75"
    />

    <!-- High-Precision Screen Inset -->
    <rect
      x="31"
      y="28"
      width="38"
      height="48"
      rx="6"
      fill="#0A0F1D"
      stroke="rgba(255, 255, 255, 0.08)"
      stroke-width="1"
    />

    <!-- Dynamic Speaker Pill -->
    <rect x="45" y="31" width="10" height="2" rx="1" fill="#334155" />

    <!-- Center Hero Glyph: Precision 'T' (Tools & Text) -->
    <g>
      <!-- Top Crossbar of T -->
      <rect x="42" y="40" width="16" height="3.5" rx="1.75" fill="url(#ptGlyphGrad)" />
      <!-- Vertical Stem of T -->
      <rect x="48.25" y="42" width="3.5" height="15" rx="1.75" fill="url(#ptGlyphGrad)" />

      <!-- Technical Baseline Accent Lines -->
      <rect x="43" y="60.5" width="14" height="1.75" rx="0.875" fill="#38BDF8" opacity="0.9" />
      <rect x="45.5" y="64" width="9" height="1.5" rx="0.75" fill="#475569" />
    </g>

    <!-- Bottom Home Indicator Bar -->
    <rect x="44" y="70.5" width="12" height="1.5" rx="0.75" fill="#475569" />
  </g>
</svg>
