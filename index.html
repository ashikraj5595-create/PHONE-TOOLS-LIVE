    <!-- Theme Color -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PHONE TOOLS",
      "url": "https://phone-tools-live.vercel.app/",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "All",
      "description": "A privacy-first collection of useful everyday browser tools for images, PDFs, text, QR codes, calculators, converters, and utilities.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('phonetools_theme_v1');
          var m = (t === 'light' || t === 'dark' || t === 'system') ? t : 'system';
          var isDark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100 selection:bg-slate-200 dark:selection:bg-slate-800">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
